<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Source artwork for the DH coin. Rendered to transparent PNG/WebP by tools/render-assets.mjs.
     ?face=front | ?face=back -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&display=block" rel="stylesheet">
<style>html,body{margin:0;background:transparent}svg{display:block}</style>
</head>
<body>
<svg id="coin" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"></svg>
<script>
const face = new URLSearchParams(location.search).get('face') || 'front';
const C = 512, NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('coin');
const parts = [];

parts.push(`<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF1B8"/><stop offset=".18" stop-color="#E6C778"/>
    <stop offset=".42" stop-color="#B8892B"/><stop offset=".6" stop-color="#F3DA8C"/>
    <stop offset=".82" stop-color="#9C6F1E"/><stop offset="1" stop-color="#E9CB7B"/>
  </linearGradient>
  <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF4C4"/><stop offset=".35" stop-color="#E6C778"/>
    <stop offset=".55" stop-color="#C79A3A"/><stop offset=".8" stop-color="#8E6418"/><stop offset="1" stop-color="#D9B460"/>
  </linearGradient>
  <radialGradient id="face" cx=".42" cy=".36" r=".75">
    <stop offset="0" stop-color="#1A2A4A"/><stop offset=".45" stop-color="#0B1426"/><stop offset="1" stop-color="#03060F"/>
  </radialGradient>
  <radialGradient id="rimShade" cx=".5" cy=".5" r=".5">
    <stop offset=".86" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/>
  </radialGradient>
  <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/>
    <feSpecularLighting in="b" surfaceScale="5" specularConstant=".9" specularExponent="22" lighting-color="#FFF6D6" result="s">
      <feDistantLight azimuth="225" elevation="48"/>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
    <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".75" k4="0" result="lit"/>
    <feDropShadow in="lit" dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".75"/>
  </filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <path id="ringText" d="M ${C} ${C} m -330 0 a 330 330 0 1 1 660 0 a 330 330 0 1 1 -660 0"/>
  <path id="ringTextBottom" d="M ${C - 366} ${C} a 366 366 0 0 0 732 0"/>
</defs>`);

// --- Thick ridged rim ---------------------------------------------------
parts.push(`<circle cx="${C}" cy="${C}" r="506" fill="url(#gold)"/>`);
let ridges = '';
for (let i = 0; i < 180; i++) {
  const a = (i / 180) * Math.PI * 2;
  const x1 = C + Math.cos(a) * 470, y1 = C + Math.sin(a) * 470;
  const x2 = C + Math.cos(a) * 504, y2 = C + Math.sin(a) * 504;
  ridges += `M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}`;
}
parts.push(`<path d="${ridges}" stroke="#6E4C12" stroke-opacity=".55" stroke-width="4.2"/>`);
parts.push(`<path d="${ridges}" stroke="#FFF2C2" stroke-opacity=".35" stroke-width="1.4" transform="rotate(.9 ${C} ${C})"/>`);
parts.push(`<circle cx="${C}" cy="${C}" r="506" fill="url(#rimShade)"/>`);
// bevel rings
parts.push(`<circle cx="${C}" cy="${C}" r="470" fill="url(#goldV)"/>`);
parts.push(`<circle cx="${C}" cy="${C}" r="446" fill="#6B4910"/>`);
parts.push(`<circle cx="${C}" cy="${C}" r="442" fill="url(#gold)"/>`);
parts.push(`<circle cx="${C}" cy="${C}" r="428" fill="url(#face)"/>`);
parts.push(`<circle cx="${C}" cy="${C}" r="428" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="10" filter="url(#softGlow)"/>`);
// fine inner beaded ring
let beads = '';
for (let i = 0; i < 96; i++) {
  const a = (i / 96) * Math.PI * 2;
  beads += `<circle cx="${(C + Math.cos(a) * 408).toFixed(1)}" cy="${(C + Math.sin(a) * 408).toFixed(1)}" r="3.2"/>`;
}
parts.push(`<g fill="url(#gold)" opacity=".9">${beads}</g>`);

// --- helpers --------------------------------------------------------------
const star = (cx, cy, R, r = R * 0.42, n = 5, rot = -90) => {
  let d = '';
  for (let i = 0; i < n * 2; i++) {
    const rad = i % 2 ? r : R, a = ((rot + (i * 180) / n) * Math.PI) / 180;
    d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rad).toFixed(1) + ' ' + (cy + Math.sin(a) * rad).toFixed(1);
  }
  return d + 'Z';
};
const leaf = (x, y, len, w, angle) => {
  const a = (angle * Math.PI) / 180, ca = Math.cos(a), sa = Math.sin(a);
  const P = (u, v) => [(x + u * ca - v * sa).toFixed(1), (y + u * sa + v * ca).toFixed(1)].join(' ');
  return `M${P(0, 0)}Q${P(len * 0.5, -w)} ${P(len, 0)}Q${P(len * 0.5, w)} ${P(0, 0)}Z`;
};
function laurel(side) {
  // branch follows an arc along the lower half of the face
  const s = side === 'left' ? -1 : 1;
  let stem = '', leaves = '', veins = '';
  const R = 345, start = 112, end = 28; // degrees from bottom center
  const pts = [];
  for (let t = 0; t <= 1.0001; t += 0.01) {
    const deg = start + (end - start) * t;
    const a = ((90 + s * deg) * Math.PI) / 180;
    pts.push([C + Math.cos(a) * R, C + Math.sin(a) * R]);
  }
  stem = 'M' + pts.map((p) => p.map((n) => n.toFixed(1)).join(' ')).join('L');
  for (let k = 0; k < 13; k++) {
    const t = 0.04 + k * 0.074;
    const i = Math.round(t * (pts.length - 1));
    const p = pts[i], q = pts[Math.min(pts.length - 1, i + 1)];
    const dir = (Math.atan2(q[1] - p[1], q[0] - p[0]) * 180) / Math.PI;
    const size = 1 - k * 0.035;
    leaves += `<path d="${leaf(p[0], p[1], 58 * size, 15 * size, dir - 38)}"/>`;
    leaves += `<path d="${leaf(p[0], p[1], 58 * size, 15 * size, dir + 38)}"/>`;
  }
  return `<g filter="url(#emboss)"><path d="${stem}" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/><g fill="url(#gold)">${leaves}</g></g>`;
}

if (face === 'front') {
  // orbital accent — tilted ellipse behind the monogram with a small orbiting star
  parts.push(`<g transform="rotate(-18 ${C} ${C})" opacity=".85">
    <ellipse cx="${C}" cy="${C + 10}" rx="330" ry="92" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <ellipse cx="${C}" cy="${C + 10}" rx="330" ry="92" fill="none" stroke="#FFE7A3" stroke-width="10" opacity=".18" filter="url(#softGlow)"/>
    <circle cx="${C + 318}" cy="${C - 12}" r="9" fill="#FFF3C9"/>
    <circle cx="${C + 318}" cy="${C - 12}" r="20" fill="#FFD27A" opacity=".35" filter="url(#softGlow)"/>
  </g>`);
  // laurels
  parts.push(laurel('left'), laurel('right'));
  // crown
  parts.push(`<g filter="url(#emboss)" fill="url(#goldV)" transform="translate(${C} 252)">
    <path d="M-96 46 L-112 -28 L-62 8 L-34 -46 L0 -2 L34 -46 L62 8 L112 -28 L96 46 Z"/>
    <rect x="-100" y="46" width="200" height="22" rx="4"/>
    <circle cx="-112" cy="-34" r="11"/><circle cx="-34" cy="-54" r="11"/><circle cx="34" cy="-54" r="11"/><circle cx="112" cy="-34" r="11"/>
    <circle cx="0" cy="-20" r="13"/>
    <g fill="#0B1426" opacity=".85"><circle cx="-50" cy="57" r="5"/><circle cx="0" cy="57" r="6"/><circle cx="50" cy="57" r="5"/></g>
  </g>`);
  // stars
  const starPos = [[-200, -150, 16], [200, -150, 16], [-260, -40, 10], [260, -40, 10], [-150, -230, 9], [150, -230, 9], [0, 300, 18], [-70, 285, 9], [70, 285, 9]];
  parts.push(`<g fill="url(#gold)" filter="url(#emboss)">${starPos.map(([x, y, r]) => `<path d="${star(C + x, C + y, r)}"/>`).join('')}</g>`);
  // embossed DH monogram
  parts.push(`<g filter="url(#emboss)">
    <text x="${C}" y="${C + 108}" text-anchor="middle" font-family="Cinzel" font-weight="900" font-size="318" letter-spacing="-6" fill="url(#goldV)">DH</text>
  </g>`);
  parts.push(`<rect x="${C - 120}" y="${C + 140}" width="240" height="4" rx="2" fill="url(#gold)" opacity=".9"/>`);
} else {
  // reverse face — ring legend, compass star emblem, motto
  parts.push(`<g font-family="Cinzel" font-weight="700" font-size="46" letter-spacing="10" fill="url(#gold)" filter="url(#emboss)">
    <text><textPath href="#ringText" startOffset="25%" text-anchor="middle">DE'ARIS HENRY</textPath></text>
  </g>`);
  parts.push(`<g font-family="Cinzel" font-weight="700" font-size="34" letter-spacing="8" fill="url(#gold)" filter="url(#emboss)">
    <text><textPath href="#ringTextBottom" startOffset="50%" text-anchor="middle">VISION · STRATEGY · EXECUTION</textPath></text>
  </g>`);
  parts.push(`<g fill="url(#gold)" filter="url(#emboss)">
    <path d="${star(C - 300, C - 8, 14)}"/><path d="${star(C + 300, C - 8, 14)}"/>
  </g>`);
  parts.push(`<g filter="url(#emboss)">
    <path d="${star(C, C - 20, 170, 34, 4, -90)}" fill="url(#goldV)"/>
    <path d="${star(C, C - 20, 110, 26, 4, -45)}" fill="url(#gold)" opacity=".92"/>
    <circle cx="${C}" cy="${C - 20}" r="40" fill="#0B1426" stroke="url(#gold)" stroke-width="6"/>
    <path d="${star(C, C - 20, 22)}" fill="url(#gold)"/>
  </g>`);
  parts.push(`<circle cx="${C}" cy="${C - 20}" r="215" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity=".8"/>`);
}
// specular sheen across the whole coin
parts.push(`<defs><linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".07"/></linearGradient></defs>
<circle cx="${C}" cy="${C}" r="506" fill="url(#sheen)"/>`);

svg.innerHTML = parts.join('');
document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
