<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@500&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#030712}
  body{position:relative;font-family:Inter,sans-serif;color:#e5e7eb}
  canvas{position:absolute;inset:0}
  .bg{position:absolute;inset:0;background:url(../assets/img/vault-interior.jpg) center/cover}
  .bg::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,5,10,.55),rgba(3,5,10,.82) 45%,rgba(3,5,10,.88))}
  .wrap{position:absolute;inset:0;display:flex;align-items:center;gap:56px;padding:0 80px}
  img{width:360px;height:360px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.6)) drop-shadow(0 0 40px rgba(212,175,55,.25))}
  h1{font:700 64px/1.05 Cinzel,serif;letter-spacing:.08em;margin:0 0 18px;background:linear-gradient(100deg,#b8892b,#f3da8c 35%,#fff1b8 60%,#c99a3a);-webkit-background-clip:text;color:transparent}
  p{margin:0 0 14px;font-size:21px;line-height:1.5;color:#cbd5e1;letter-spacing:.04em}
  .t{font:600 24px/1.4 Cinzel,serif;color:#e6c778}
</style></head>
<body>
<div class="bg"></div>
<div class="wrap">
  <img src="../assets/img/dh-coin-front.png" alt="">
  <div>
    <h1>DE'ARIS HENRY</h1>
    <p>Entrepreneur · Business Strategist · Sales &amp; Operations Leader · Recruiter · Investor · Author · Creative Producer</p>
    <p class="t">Building Businesses. Developing Talent.<br>Connecting Opportunities. Executing Strategy.</p>
  </div>
</div>
<script>
  document.fonts.ready.then(() => document.body.dataset.ready = '1');
</script>
</body></html>
